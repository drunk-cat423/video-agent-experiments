<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="商品替换图片模型实测：同一人物关键帧、同一提示词，对比渠道、效果、费用。"><title>商品替换实验册 · Video Agent</title><link rel="stylesheet" href="style.css?v=4"><script src="app.js?v=4" defer></script></head>
<body>
<main>
<section class="recipe" aria-label="提示词"><p id="prompt" tabindex="0">将第一张图片中人物手中的物品自然地替换成第二张的主体物品</p><button id="copy-prompt" class="copy">复制提示词</button></section>
<section id="results"><div class="filters"><div class="segmented" aria-label="选择商品"><button data-product="materials" aria-pressed="false">素材</button><button class="active" data-product="cup" aria-pressed="true">蓝色杯子</button><button data-product="water" aria-pressed="false">绿色水瓶</button><button data-product="all" aria-pressed="false">全部</button></div><label>渠道 <select id="provider"><option value="all">所有渠道</option><option value="AnyAIGC">AnyAIGC</option><option value="WawAPI">WawAPI</option></select></label></div><div id="gallery" class="gallery"></div><noscript>请启用 JavaScript 查看筛选式实验图册。</noscript></section>

</main>
<dialog id="viewer"><div class="viewer-bar"><strong id="viewer-title"></strong><button id="close-viewer" aria-label="关闭图片预览">×</button></div><img id="viewer-image" alt=""><a id="original" target="_blank" rel="noopener">打开原尺寸图片 ↗</a></dialog><div id="toast" role="status"></div>
</body></html>
